<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#ffffff"/>

  <text x="800" y="62" text-anchor="middle" font-size="34" font-weight="600" fill="#1f2328">ReaProjectLink 的两个方向</text>
  <text x="800" y="102" text-anchor="middle" font-size="22" fill="#57606a">各部门在自己的工程里工作，只通过共享目录里发布的文件互相联系</text>

  <g font-size="26" text-anchor="middle">
    <rect x="90" y="170" width="380" height="140" rx="18" fill="#f3f6fb" stroke="#8fa8cc" stroke-width="2"/>
    <text x="280" y="232" font-weight="600" fill="#1f2328">Source Project</text>
    <text x="280" y="272" font-size="22" fill="#57606a">对白工程</text>

    <rect x="90" y="380" width="380" height="140" rx="18" fill="#f3f6fb" stroke="#8fa8cc" stroke-width="2"/>
    <text x="280" y="442" font-weight="600" fill="#1f2328">Source Project</text>
    <text x="280" y="482" font-size="22" fill="#57606a">音乐工程</text>

    <rect x="90" y="590" width="380" height="140" rx="18" fill="#f3f6fb" stroke="#8fa8cc" stroke-width="2"/>
    <text x="280" y="652" font-weight="600" fill="#1f2328">Source Project</text>
    <text x="280" y="692" font-size="22" fill="#57606a">音效工程</text>
  </g>

  <g text-anchor="middle">
    <rect x="1130" y="330" width="380" height="230" rx="18" fill="#fbf6ef" stroke="#d6a66b" stroke-width="2"/>
    <text x="1320" y="420" font-size="30" font-weight="600" fill="#1f2328">Master Project</text>
    <text x="1320" y="462" font-size="22" fill="#57606a">整合与混音工程</text>
    <text x="1320" y="496" font-size="22" fill="#57606a">持有画面和时间线标记</text>
  </g>

  <g fill="none" stroke="#2f6fd6" stroke-width="4" marker-end="url(#arrow-blue)">
    <path d="M470,225 C800,225 900,380 1125,395"/>
    <path d="M470,435 C760,435 900,430 1125,430"/>
    <path d="M470,645 C800,645 900,480 1125,465"/>
  </g>

  <g fill="none" stroke="#d9822b" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow-orange)">
    <path d="M1125,510 C900,560 760,720 475,700"/>
    <path d="M1125,500 C900,520 760,500 475,490"/>
    <path d="M1125,350 C900,300 760,270 475,280"/>
  </g>

  <g font-size="22">
    <line x1="420" y1="800" x2="500" y2="800" stroke="#2f6fd6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="515" y="808" font-weight="600" fill="#2f6fd6">Delivery</text>
    <text x="640" y="808" fill="#57606a">Source 发布弹出好的音频（Publish），Master 同步进来（Synchronize）</text>

    <line x1="420" y1="870" x2="500" y2="870" stroke="#d9822b" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow-orange)"/>
    <text x="515" y="878" font-weight="600" fill="#d9822b">Reference</text>
    <text x="640" y="878" fill="#57606a">Master 发布画面和标记（Publish），Source 同步过去（Synchronize）</text>
  </g>
</svg>
